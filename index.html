<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Calm Sea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="modal-window" class="window">
        <div class="window-header">
            <span class="window-title">ASCII Calm Sea</span>
            <div class="window-controls">
                <button id="theme-btn" class="header-btn" title="Toggle Light/Dark Mode">☀</button>
                <button id="minimize-btn" class="header-btn">_</button>
            </div>
        </div>
        <div id="window-content" class="window-content">
            <p>Click and hold to create a splash.</p>
            <p>Drag to create wakes.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
