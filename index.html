<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Calm Sea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="modal-window" class="window">
        <div class="window-header">
            <span class="window-title">root@ascii-sea:~</span>
            <div class="window-controls">
                <button id="theme-btn" class="theme-btn">☾</button>
                <button id="minimize-btn" class="minimize-btn">_</button>
            </div>
        </div>
        <div id="window-content" class="window-content">
            <div id="terminal">
                <div id="terminal-output">Welcome to ASCII Sea OS v1.0.0
Type 'help' to see available commands.
</div>
                <div id="terminal-input-line">
                    <span class="prompt">root@sea:~$</span>
                    <input type="text" id="terminal-input" autocomplete="off" spellcheck="false">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
